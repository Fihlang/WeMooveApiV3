version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: furniture_delivery_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=furniture_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - furniture_delivery_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furniture_delivery_api
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/furniture_delivery
      - PORT=5000
    networks:
      - furniture_delivery_network
    restart: unless-stopped

networks:
  furniture_delivery_network:
    driver: bridge

volumes:
  postgres_data: